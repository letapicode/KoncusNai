name: ci

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore DictateAnywhere.sln --locked-mode

      - name: Supply-chain Compliance
        id: supply_chain
        shell: pwsh
        run: ./scripts/security-compliance.ps1 -OutputPath artifacts/supply-chain-ci/compliance.json

      - name: Documentation Claims
        shell: pwsh
        run: ./scripts/validate-documentation-claims.ps1

      - name: Public CI Evidence Safeguard Self-Test
        shell: pwsh
        run: ./scripts/test-ci-evidence-preparation.ps1

      - name: Python Dependency Advisories
        id: python_advisories
        shell: pwsh
        run: ./scripts/audit-python-advisories.ps1 -OutputPath artifacts/supply-chain-ci/python-advisories.json -FailOnFindings

      - name: Tracked and Bundled Size Budgets
        shell: pwsh
        run: ./scripts/validate-size-budgets.ps1

      - name: Build
        run: dotnet build DictateAnywhere.sln --configuration Release --no-restore

      - name: Validate Production Build Role
        run: dotnet build DictateAnywhere.Production.slnf --configuration Release --no-restore

      - name: Validate Developer Tool Build Role
        run: dotnet build DictateAnywhere.DeveloperTools.slnf --configuration Release --no-restore

      - name: Public API and Compiled Dependency Contract
        shell: pwsh
        run: ./scripts/validate-public-api.ps1 -NoBuild

      - name: Deterministic Focused Tests
        shell: pwsh
        run: ./scripts/run-focused-tests.ps1 -Suite Deterministic -NoBuild

      - name: Deterministic Coverage Threshold Gate
        id: coverage
        shell: pwsh
        run: ./scripts/run-coverage-gate.ps1 -NoBuild -OutputDirectory artifacts/coverage-ci

      - name: Controlled Fault-Seed Gate
        id: fault_seeds
        shell: pwsh
        run: ./scripts/run-controlled-fault-seeds.ps1 -OutputDirectory artifacts/controlled-fault-seeds-ci

      - name: Prepare public CI evidence
        id: prepare_evidence
        if: always()
        shell: pwsh
        run: |
          $complete = '${{ steps.supply_chain.outcome }}' -eq 'success' -and '${{ steps.python_advisories.outcome }}' -eq 'success' -and '${{ steps.coverage.outcome }}' -eq 'success' -and '${{ steps.fault_seeds.outcome }}' -eq 'success'
          ./scripts/prepare-ci-evidence.ps1 -RequireComplete:$complete

      - name: Upload Coverage and Fault Evidence
        if: ${{ always() && steps.prepare_evidence.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-and-fault-evidence
          path: artifacts/ci-evidence-upload
          if-no-files-found: error
          retention-days: 14

      - name: Test
        run: dotnet test DictateAnywhere.sln --configuration Release --no-build --maxcpucount:1 --logger "trx;LogFileName=test-results.trx"

      - name: Performance Regression Check
        shell: pwsh
        run: ./scripts/run-performance-regression.ps1 -OutputDirectory artifacts/performance-ci -ReportPath docs/release/performance-regression-ci-report.md

      - name: Milestone 2 Reliability Regression
        shell: pwsh
        run: ./scripts/run-milestone2-reliability.ps1 -SoakIterations 3 -OutputDirectory artifacts/milestone2-ci -ReportPath docs/release/milestone-2-reliability-ci-report.md

      - name: Fault Injection Scenarios
        shell: pwsh
        run: ./scripts/run-fault-injection.ps1 -OutputDirectory artifacts/fault-injection-ci -ReportPath docs/release/fault-injection-ci-report.md

      - name: Compatibility Gate Contract Check
        shell: pwsh
        run: ./scripts/run-compatibility-gate.ps1 -OutputDirectory artifacts/compatibility-ci -ReportPath docs/release/compatibility-gate-ci-report.md -ReleaseLine 1.x

      - name: Milestone 3 Elevated Static Acceptance
        shell: pwsh
        run: ./scripts/run-milestone3-elevated-acceptance.ps1 -OutputDirectory artifacts/milestone3-ci -ReportPath docs/release/milestone-3-elevated-acceptance-ci-report.md

      - name: Packaging Smoke Check
        shell: pwsh
        run: ./scripts/packaging-smoke.ps1

      - name: Installer Upgrade Compatibility Check
        shell: pwsh
        run: ./scripts/installer-upgrade-compatibility.ps1
